spring:
  application:
    name: pokerlab-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pokerlab}
    username: ${DATABASE_USER:pokerlab}
    password: ${DATABASE_PASSWORD:pokerlab}
    hikari:
      maximum-pool-size: 10
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
server:
  port: ${PORT:8080}
