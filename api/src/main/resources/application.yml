spring:
  main:
    banner-mode: off
  application:
    name: pokerlab-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pokerlab}
    username: ${DATABASE_USER:pokerlab}
    password: ${DATABASE_PASSWORD:pokerlab}
    hikari:
      maximum-pool-size: 10
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 200ms
management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
server:
  port: ${PORT:8080}
  shutdown: graceful
pokerlab:
  cache:
    enabled: ${CACHE_ENABLED:true}
  trainer:
    paired-flop-interval-research-enabled: ${TRAINER_PAIRED_FLOP_INTERVAL_RESEARCH_ENABLED:false}
    paired-flop-interval-request-path: ${TRAINER_PAIRED_FLOP_INTERVAL_REQUEST_PATH:}
    paired-flop-interval-report-path: ${TRAINER_PAIRED_FLOP_INTERVAL_REPORT_PATH:}
    paired-flop-interval-report-hash: ${TRAINER_PAIRED_FLOP_INTERVAL_REPORT_HASH:}
    btn-flop-interval-research-enabled: ${TRAINER_BTN_FLOP_INTERVAL_RESEARCH_ENABLED:false}
    btn-flop-interval-request-path: ${TRAINER_BTN_FLOP_INTERVAL_REQUEST_PATH:}
    btn-flop-interval-report-path: ${TRAINER_BTN_FLOP_INTERVAL_REPORT_PATH:}
    btn-flop-interval-report-hash: ${TRAINER_BTN_FLOP_INTERVAL_REPORT_HASH:}
    mixed-flop-interval-collection-enabled: ${TRAINER_MIXED_FLOP_INTERVAL_COLLECTION_ENABLED:false}
    mixed-flop-interval-collection-manifest-path: ${TRAINER_MIXED_FLOP_INTERVAL_COLLECTION_MANIFEST_PATH:}
    mixed-flop-interval-collection-hash: ${TRAINER_MIXED_FLOP_INTERVAL_COLLECTION_HASH:}
    flop-interval-collection-enabled: ${TRAINER_FLOP_INTERVAL_COLLECTION_ENABLED:false}
    flop-interval-collection-manifest-path: ${TRAINER_FLOP_INTERVAL_COLLECTION_MANIFEST_PATH:}
    flop-interval-collection-hash: ${TRAINER_FLOP_INTERVAL_COLLECTION_HASH:}
    later-flop-interval-research-enabled: ${TRAINER_LATER_FLOP_INTERVAL_RESEARCH_ENABLED:false}
    later-flop-interval-request-path: ${TRAINER_LATER_FLOP_INTERVAL_REQUEST_PATH:}
    later-flop-interval-report-path: ${TRAINER_LATER_FLOP_INTERVAL_REPORT_PATH:}
    later-flop-interval-report-hash: ${TRAINER_LATER_FLOP_INTERVAL_REPORT_HASH:}
    refined-flop-interval-research-enabled: ${TRAINER_REFINED_FLOP_INTERVAL_RESEARCH_ENABLED:false}
    refined-flop-interval-request-path: ${TRAINER_REFINED_FLOP_INTERVAL_REQUEST_PATH:}
    refined-flop-interval-report-path: ${TRAINER_REFINED_FLOP_INTERVAL_REPORT_PATH:}
    refined-flop-interval-report-hash: ${TRAINER_REFINED_FLOP_INTERVAL_REPORT_HASH:}
    flop-interval-research-enabled: ${TRAINER_FLOP_INTERVAL_RESEARCH_ENABLED:false}
    flop-interval-request-path: ${TRAINER_FLOP_INTERVAL_REQUEST_PATH:}
    flop-interval-report-path: ${TRAINER_FLOP_INTERVAL_REPORT_PATH:}
    flop-interval-report-hash: ${TRAINER_FLOP_INTERVAL_REPORT_HASH:}
    interval-collection-enabled: ${TRAINER_INTERVAL_COLLECTION_ENABLED:false}
    interval-collection-manifest-path: ${TRAINER_INTERVAL_COLLECTION_MANIFEST_PATH:}
    interval-collection-hash: ${TRAINER_INTERVAL_COLLECTION_HASH:}
    interval-research-enabled: ${TRAINER_INTERVAL_RESEARCH_ENABLED:false}
    interval-request-path: ${TRAINER_INTERVAL_REQUEST_PATH:}
    interval-report-path: ${TRAINER_INTERVAL_REPORT_PATH:}
    interval-report-hash: ${TRAINER_INTERVAL_REPORT_HASH:}
    research-enabled: ${TRAINER_RESEARCH_ENABLED:false}
    research-pack-path: ${TRAINER_RESEARCH_PACK_PATH:}
    multiway-research-enabled: ${TRAINER_MULTIWAY_RESEARCH_ENABLED:false}
    multiway-research-pack-path: ${TRAINER_MULTIWAY_RESEARCH_PACK_PATH:}
    sixmax-preflop-research-enabled: ${TRAINER_SIXMAX_PREFLOP_RESEARCH_ENABLED:false}
    sixmax-preflop-research-pack-path: ${TRAINER_SIXMAX_PREFLOP_RESEARCH_PACK_PATH:}
    river-research-enabled: ${TRAINER_RIVER_RESEARCH_ENABLED:false}
    river-research-pack-path: ${TRAINER_RIVER_RESEARCH_PACK_PATH:}
    turn-river-research-enabled: ${TRAINER_TURN_RIVER_RESEARCH_ENABLED:false}
    turn-river-research-pack-path: ${TRAINER_TURN_RIVER_RESEARCH_PACK_PATH:}
    flop-research-enabled: ${TRAINER_FLOP_RESEARCH_ENABLED:false}
    flop-research-pack-path: ${TRAINER_FLOP_RESEARCH_PACK_PATH:}
  queue:
    mode: ${QUEUE_MODE:sqs}
    region: ${AWS_REGION:eu-west-2}
    endpoint: ${SQS_ENDPOINT:}
    url: ${SQS_QUEUE_URL:http://localhost:4566/000000000000/pokerlab}
    dlq-url: ${SQS_DLQ_URL:http://localhost:4566/000000000000/pokerlab-dlq}
logging:
  structured:
    format:
      console: ecs
