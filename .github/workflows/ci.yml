name: CI
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B spotless:check verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: "**/target/surefire-reports/*"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: infrastructure/terraform }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "1.13.5" }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --scale worker=2
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:18080/actuator/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: ./scripts/smoke.sh
      - run: curl --fail http://localhost:18080/v3/api-docs && curl --fail http://localhost:8080/
      - name: Redis outage remains correct
        run: |
          docker compose stop redis
          ./scripts/smoke.sh
      - name: Service logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: compose-log, path: compose.log }
      - if: always()
        run: docker compose down -v
