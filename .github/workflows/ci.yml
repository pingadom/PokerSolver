name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    # Preserve all checks and per-job bounds as complete solver evidence grows.
    # The final evidence job independently checks disjoint, complete class coverage.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [solver-0, solver-1, solver-2, solver-3, solver-4, solver-5, solver-6, solver-7, services-0, services-1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Build dependencies and check all formatting
        run: mvn -B spotless:check install -DskipTests
      - name: Independently verify saved solver evidence and corruption controls
        if: matrix.group == 'solver-2'
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_supplied_zero_reach.py'
          python3 -m unittest discover -s scripts -p 'test_check_supplied_reach_bounds.py'
          python3 -m unittest discover -s scripts -p 'test_check_supplied_connected_flop.py'
          python3 -m unittest discover -s scripts -p 'test_check_supplied_flop_action_bounds.py'
          python3 -m unittest discover -s scripts -p 'test_check_supplied_flop_feedback.py'
          python3 -m unittest discover -s scripts -p 'test_check_later_bb_flop_feedback.py'
          python3 -m unittest discover -s scripts -p 'test_check_btn_flop_feedback.py'
          python3 -m unittest discover -s scripts -p 'test_lp_pivot_regressions.py'
          python3 -m unittest discover -s scripts -p 'test_check_refined_parent_study.py'
          python3 -m unittest discover -s scripts -p 'test_check_refined_conditional_study.py'
          python3 -m unittest discover -s scripts -p 'test_check_refined_basis_conditional_study.py'
          python3 -m unittest discover -s scripts -p 'test_check_resolvable_refined_lp.py'
          python3 -m unittest discover -s scripts -p 'test_check_weak_hand_resolvable_study.py'
          python3 -m unittest discover -s scripts -p 'test_check_weak_hand_flop_feedback.py'
          python3 -m unittest discover -s scripts -p 'test_check_paired_flop_curriculum.py'
          python3 -m unittest discover -s scripts -p 'test_check_paired_flop_drill.py'
          python3 -m unittest discover -s scripts -p 'test_check_refined_flop_feedback.py'
          python3 -m unittest discover -s scripts -p 'test_check_refined_flop_drill.py'
          python3 -m unittest discover -s scripts -p 'test_check_btn_flop_curriculum.py'
          python3 -m unittest discover -s scripts -p 'test_check_btn_flop_drill.py'
          python3 -m unittest discover -s scripts -p 'test_check_later_bb_flop_drill.py'
          python3 -m unittest discover -s scripts -p 'test_check_flop_interval_collection.py'
          python3 -m unittest discover -s scripts -p 'test_check_mixed_flop_interval_collection.py'
          python3 -m unittest discover -s scripts -p 'test_check_expanded_flop_interval_collection.py'
          python3 -m unittest discover -s scripts -p 'test_check_qualified_flop_collection.py'
          python3 -m unittest discover -s scripts -p 'test_check_weak_range_flop_coverage.py'
          python3 -m unittest discover -s scripts -p 'test_check_certified_reach_coverage.py'
          python3 -m unittest discover -s scripts -p 'test_check_shared_call_flop_feedback.py'
          python3 -m unittest discover -s scripts -p 'test_check_call_flop_collection.py'
      - name: Independently verify unpaired-board discovery and qualified source
        if: matrix.group == 'solver-2'
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_unpaired_flop_discovery.py'
          python3 -m unittest discover -s scripts -p 'test_check_unpaired_shared_flop.py'
      - name: Independently verify eighteen-question collection and smoke controls
        if: matrix.group == 'solver-0'
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_unpaired_flop_collection.py'
          python3 -m unittest discover -s scripts -p 'test_smoke_unpaired_flop_collection.py'
      - name: Independently verify BB discovery and phase-I endpoint regression
        if: matrix.group == 'solver-1'
        run: python3 -m unittest discover -s scripts -p 'test_check_big_blind_flop_discovery.py'
      - name: Independently verify BB pairwise regret and fresh policy gates
        if: matrix.group == 'solver-6'
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_big_blind_pairwise_study.py'
          python3 -m unittest discover -s scripts -p 'test_check_big_blind_pairwise_feedback.py'
      - name: Independently verify sizing screens, qualified pot-size source and cached reviews
        if: matrix.group == 'solver-0'
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_bb_sizing_primary_screen.py'
          python3 -m unittest discover -s scripts -p 'test_check_bb_pot_size_feedback.py'
          python3 -m unittest discover -s scripts -p 'test_check_bb_pot_size_review.py'
          python3 -m unittest discover -s scripts -p 'test_check_sizing_flop_collection.py'
      - name: Verify assigned backend tests
        run: python3 scripts/backend-ci.py run ${{ matrix.group }}
      - name: Independently verify joint flop size-menu physics and corruption controls
        if: matrix.group == 'solver-3'
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_flop_size_menu.py'
          python3 -m unittest discover -s scripts -p 'test_check_size_menu_conditional.py'
          python3 -m unittest discover -s scripts -p 'test_check_size_menu_feedback.py'
          python3 -m unittest discover -s scripts -p 'test_check_size_menu_btn.py'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-results-${{ matrix.group }}
          if-no-files-found: error
          path: |
            **/target/surefire-reports/*
            backend-ci-manifest-${{ matrix.group }}.json
  backend-evidence:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: junit-results-*
          path: .ci-evidence
          merge-multiple: false
      - name: Require complete backend test evidence
        run: |
          python3 -m unittest discover -s scripts -p 'test_backend_ci.py'
          python3 scripts/backend-ci.py verify .ci-evidence
      - uses: actions/upload-artifact@v7
        with:
          name: junit-results
          path: .ci-evidence/**
          include-hidden-files: true
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: Keep interval UI fixture identical to physically replayed evidence
        run: cmp ../docs/data/supplied-conditional-five-target-99-interval-drill.json src/test-data/interval-drill.json
      - name: Keep flop interval UI fixture identical to physically replayed evidence
        run: cmp ../docs/data/supplied-four-button-hand-flop-drill.json src/test-data/flop-interval-drill.json
      - name: Keep later flop UI fixture identical to physically replayed evidence
        run: cmp ../docs/data/supplied-four-button-hand-later-bb-flop-drill.json src/test-data/later-flop-interval-drill.json
      - name: Keep BTN flop UI fixture identical to physically replayed evidence
        run: cmp ../docs/data/supplied-four-button-hand-btn-flop-drill.json src/test-data/btn-flop-interval-drill.json
      - name: Keep mixed flop UI fixture identical to physically replayed sources
        run: cmp ../docs/data/supplied-two-flop-interval-collection-review.json src/test-data/flop-collection-review.json
      - name: Check six-question mixed flop fixture bytes
        run: cmp ../docs/data/supplied-six-question-flop-collection-review.json src/test-data/mixed-flop-collection-review.json
      - name: Check ten-question two-board fixture bytes
        run: cmp ../docs/data/supplied-ten-question-flop-collection-review.json src/test-data/expanded-flop-collection-review.json
      - name: Check eleven-question and weak-hand UI fixture bytes
        run: |
          cmp ../docs/data/supplied-eleven-question-flop-collection-review.json src/test-data/qualified-flop-collection-review.json
          cmp ../docs/data/supplied-weak-hand-qualified-flop-drill.json src/test-data/weak-hand-flop-drill.json
      - name: Check fourteen-question UI fixture bytes
        run: cmp ../docs/data/supplied-fourteen-question-flop-collection-review.json src/test-data/call-flop-collection-review.json
      - name: Keep collection UI fixture identical to physically replayed evidence
        run: cmp ../docs/data/supplied-four-question-interval-collection-review.json src/test-data/interval-collection-review.json
      - name: Keep seven-question UI fixture identical to physically replayed evidence
        run: cmp ../docs/data/supplied-seven-question-interval-collection-review.json src/test-data/interval-collection-seven-review.json
      - name: Check eighteen-question UI fixture bytes
        run: cmp ../docs/data/supplied-eighteen-question-flop-collection-review.json src/test-data/unpaired-flop-collection-review.json
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: infrastructure/terraform }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "1.13.5" }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.trainer.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.trainer.yml -f docker-compose.trainer-side-pot.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.trainer-interval.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.trainer-flop-interval.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.trainer-later-flop-interval.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.trainer-flop-interval-collection.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.trainer-btn-flop-interval.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.trainer-interval-collection.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.trainer-interval-collection.yml -f docker-compose.trainer-interval-collection-seven.yml config --quiet
      - name: Verify interval smoke readiness retries
        run: python3 -m unittest discover -s scripts -p 'test_smoke_interval*.py'
      - run: docker compose up --build -d --scale worker=2
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:18080/actuator/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: ./scripts/smoke.sh
      - run: curl --fail http://localhost:18080/v3/api-docs && curl --fail http://localhost:8080/
      - name: Interval drill is absent without opt-in
        run: python3 scripts/smoke-interval-trainer.py --disabled
      - name: Interval collection is absent without opt-in
        run: python3 scripts/smoke-interval-collection.py --disabled
      - name: Physical flop interval drill is absent without opt-in
        run: python3 scripts/smoke-flop-interval-trainer.py --disabled
      - name: Later physical flop interval drill is absent without opt-in
        run: python3 scripts/smoke-later-flop-interval-trainer.py --disabled
      - name: Mixed flop collection is absent without opt-in
        run: python3 scripts/smoke-flop-interval-collection.py --disabled
      - name: BTN flop interval drill is absent without opt-in
        run: python3 scripts/smoke-btn-flop-interval-trainer.py --disabled
      - name: Redis outage remains correct
        run: |
          docker compose stop redis
          ./scripts/smoke.sh
      - name: Validation-only trainer overlay serves saved packs
        run: |
          docker compose start redis
          docker compose -f docker-compose.yml -f docker-compose.trainer.yml up -d --no-deps api
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:18080/api/v1/trainer/research/river > river.json; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          with open('river.json', encoding='utf-8') as source:
              river = json.load(source)
          assert river['publicationStatus'] == 'VALIDATION_ONLY'
          assert river['availableQuestions'] > 0
          PY
          curl --fail --silent http://localhost:18080/api/v1/trainer/research > preflop.json
          python3 - <<'PY'
          import json
          with open('preflop.json', encoding='utf-8') as source:
              preflop = json.load(source)
          assert preflop['publicationStatus'] == 'VALIDATION_ONLY'
          PY
          curl --fail --silent http://localhost:18080/api/v1/trainer/research/river/questions/42 > river-question.json
          python3 - <<'PY'
          import json
          import urllib.request
          with open('river-question.json', encoding='utf-8') as source:
              question = json.load(source)
          payload = json.dumps({
              'seed': question['seed'],
              'packHash': question['question']['packHash'],
              'action': question['question']['legalActions'][0],
          }).encode()
          request = urllib.request.Request(
              'http://localhost:18080/api/v1/trainer/research/river/grade',
              data=payload,
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request) as response:
              feedback = json.load(response)
          assert feedback['packHash'] == question['question']['packHash']
          assert feedback['evLossBb'] >= 0
          PY
          curl --fail --silent http://localhost:18080/api/v1/trainer/research/flop > flop.json
          python3 - <<'PY'
          import json
          import urllib.request
          with open('flop.json', encoding='utf-8') as source:
              metadata = json.load(source)
          assert metadata['publicationStatus'] == 'VALIDATION_ONLY'
          assert metadata['chanceModel'] == 'FULL_PHYSICAL_DECK'
          assert metadata['gameGapBb'] < 0.01
          payload = json.dumps({
              'seed': '42',
              'packHash': metadata['packHash'],
              'heroPlayer': 0,
              'actions': [],
          }).encode()
          request = urllib.request.Request(
              'http://localhost:18080/api/v1/trainer/research/flop/hands/replay',
              data=payload,
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request) as response:
              hand = json.load(response)
          assert hand['street'] == 'FLOP'
          assert hand['opponentCombo'] is None
          assert len(hand['legalActions']) == 2
          payload = json.dumps({
              'seed': '42',
              'packHash': metadata['packHash'],
              'heroPlayer': 0,
              'actions': ['k'],
          }).encode()
          request = urllib.request.Request(
              'http://localhost:18080/api/v1/trainer/research/flop/hands/replay',
              data=payload,
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request) as response:
              after_check = json.load(response)
          assert len(after_check['feedback']) == 1
          assert after_check['feedback'][0]['selectedEvBb'] is not None
          PY
      - name: Full-round preflop trainer serves replayable sessions
        run: python3 scripts/smoke-full-round-trainer.py
      - name: Unequal-stack trainer overlay serves graded decisions
        run: |
          docker compose -f docker-compose.yml -f docker-compose.trainer.yml -f docker-compose.trainer-side-pot.yml up -d --no-deps api
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:18080/api/v1/trainer/research/multiway > multiway-side-pot.json; then
              if python3 -c "import json; assert json.load(open('multiway-side-pot.json'))['packSchema'] == 'multiway-side-pot-pack/v1'"; then break; fi
            fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          import urllib.request
          base = 'http://localhost:18080/api/v1/trainer/research/multiway'
          with urllib.request.urlopen(base) as response:
              metadata = json.load(response)
          assert metadata['stacksBb'] == [30, 10, 20, 15, 25, 5]
          assert metadata['rangeComboCounts'] == [2, 2, 2, 2, 2, 2]
          assert metadata['payoffMethod'] == 'EXACT_ENUMERATION'
          assert metadata['nashConvBb'] < 0.05
          with urllib.request.urlopen(base + '/sessions/42/questions/0?player=5') as response:
              question = json.load(response)
          assert question['actingSeat'] == 'BB'
          assert question['stackBb'] == 5
          assert question['callCostBb'] == 4
          assert 'opponentCards' not in question
          assert 'callEvBb' not in question
          payload = json.dumps({
              'sessionSeed': '42', 'index': 0, 'player': 5,
              'packHash': question['packHash'], 'action': 'CALL',
          }).encode()
          request = urllib.request.Request(
              base + '/grade', data=payload,
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request) as response:
              graded = json.load(response)
          assert graded['question']['packHash'] == metadata['packHash']
          assert graded['feedback']['evLossBb'] >= 0
          PY
      - name: Pinned interval overlay replays qualification and serves cached grades
        run: |
          docker compose -f docker-compose.yml -f docker-compose.trainer-interval.yml up -d --no-deps api
          python3 scripts/smoke-interval-trainer.py
      - name: Pinned collection overlay replays every source and serves distinct questions
        run: |
          docker compose -f docker-compose.yml -f docker-compose.trainer-interval-collection.yml up -d --no-deps api
          python3 scripts/smoke-interval-collection.py
      - name: Seven-question overlay replays both player positions with mixed report versions
        run: |
          docker compose -f docker-compose.yml -f docker-compose.trainer-interval-collection-seven.yml up -d --no-deps api
          python3 scripts/smoke-interval-collection.py --seven
      - name: Pinned physical flop overlay replays qualification and serves cached ranges
        run: |
          docker compose -f docker-compose.yml -f docker-compose.trainer-flop-interval.yml up -d --no-deps api
          python3 scripts/smoke-flop-interval-trainer.py
      - name: Pinned later BB overlay replays qualification and serves cached fold/call ranges
        run: |
          docker compose -f docker-compose.yml -f docker-compose.trainer-later-flop-interval.yml up -d --no-deps api
          python3 scripts/smoke-later-flop-interval-trainer.py
      - name: Pinned flop collection replays both typed sources and serves mixed reviews
        run: |
          docker compose -f docker-compose.yml -f docker-compose.trainer-flop-interval-collection.yml up -d --no-deps api
          python3 scripts/smoke-flop-interval-collection.py
      - name: Four-hand BTN overlay performs long physical replay once and serves cached grades
        run: |
          docker compose -f docker-compose.yml -f docker-compose.trainer-btn-flop-interval.yml up -d --no-deps api
          python3 scripts/smoke-btn-flop-interval-trainer.py
      - name: Service logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: compose-log, path: compose.log }
      - if: always()
        run: docker compose down -v
  mixed-flop-collection-smoke:
    runs-on: ubuntu-latest
    # Independent three-source qualification; preserve the existing Compose budget.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.trainer-mixed-flop-interval-collection.yml config --quiet
      - run: python3 -m unittest discover -s scripts -p 'test_smoke_interval_mixed_flop_collection.py'
      - run: docker compose up --build -d
      - name: Wait for default API readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:18080/actuator/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Mixed flop collection is absent without opt-in
        run: python3 scripts/smoke-mixed-flop-interval-collection.py --disabled
      - name: Replay all three sources and exercise the six-question production API
        run: |
          docker compose -f docker-compose.yml -f docker-compose.trainer-mixed-flop-interval-collection.yml up -d --no-deps api
          python3 scripts/smoke-mixed-flop-interval-collection.py
      - name: Mixed collection service logs
        if: always()
        run: docker compose logs --no-color > mixed-compose.log
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: mixed-compose-log, path: mixed-compose.log }
      - if: always()
        run: docker compose down -v

  expanded-flop-collection-smoke:
    runs-on: ubuntu-latest
    # Independent four-source qualification; preserve the existing Compose budget.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.trainer-expanded-flop-interval-collection.yml config --quiet
      - run: python3 -m unittest discover -s scripts -p 'test_smoke_interval_expanded_flop_collection.py'
      - run: docker compose up --build -d
      - name: Wait for default API readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:18080/actuator/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Mixed flop collection is absent without opt-in
        run: python3 scripts/smoke-expanded-flop-interval-collection.py --disabled
      - name: Replay all four sources and exercise the ten-question production API
        run: |
          docker compose -f docker-compose.yml -f docker-compose.trainer-expanded-flop-interval-collection.yml up -d --no-deps api
          python3 scripts/smoke-expanded-flop-interval-collection.py
      - name: Mixed collection service logs
        if: always()
        run: docker compose logs --no-color > expanded-compose.log
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: expanded-compose-log, path: expanded-compose.log }
      - if: always()
        run: docker compose down -v

  refined-flop-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml -f docker-compose.trainer-refined-flop-interval.yml config --quiet
      - run: python3 -m unittest discover -s scripts -p 'test_smoke_refined_flop_interval.py'
      - run: docker compose up --build -d
      - name: Wait for default API readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:18080/actuator/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Refined source is absent without opt-in
        run: python3 scripts/smoke-refined-flop-interval-trainer.py --disabled
      - name: Fresh physical qualification and cached fold/call grades
        run: |
          docker compose -f docker-compose.yml -f docker-compose.trainer-refined-flop-interval.yml up -d --no-deps api
          python3 scripts/smoke-refined-flop-interval-trainer.py
      - name: Refined service logs
        if: always()
        run: docker compose logs --no-color > refined-compose.log
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: refined-compose-log, path: refined-compose.log }
      - if: always()
        run: docker compose down -v

  paired-flop-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml -f docker-compose.trainer-paired-flop-interval.yml config --quiet
      - run: python3 -m unittest discover -s scripts -p 'test_smoke_paired_flop_interval.py'
      - run: docker compose up --build -d
      - name: Wait for default API readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:18080/actuator/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Paired curriculum is absent without opt-in
        run: python3 scripts/smoke-paired-flop-interval-trainer.py --disabled
      - name: Fresh physical qualification and cached fold/call grades
        run: |
          docker compose -f docker-compose.yml -f docker-compose.trainer-paired-flop-interval.yml up -d --no-deps api
