name: CI
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B spotless:check verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: "**/target/surefire-reports/*"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: infrastructure/terraform }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.13.5" }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.trainer.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.trainer.yml -f docker-compose.trainer-side-pot.yml config --quiet
      - run: docker compose up --build -d --scale worker=2
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:18080/actuator/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: ./scripts/smoke.sh
      - run: curl --fail http://localhost:18080/v3/api-docs && curl --fail http://localhost:8080/
      - name: Redis outage remains correct
        run: |
          docker compose stop redis
          ./scripts/smoke.sh
      - name: Validation-only trainer overlay serves saved packs
        run: |
          docker compose start redis
          docker compose -f docker-compose.yml -f docker-compose.trainer.yml up -d --no-deps api
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:18080/api/v1/trainer/research/river > river.json; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          with open('river.json', encoding='utf-8') as source:
              river = json.load(source)
          assert river['publicationStatus'] == 'VALIDATION_ONLY'
          assert river['availableQuestions'] > 0
          PY
          curl --fail --silent http://localhost:18080/api/v1/trainer/research > preflop.json
          python3 - <<'PY'
          import json
          with open('preflop.json', encoding='utf-8') as source:
              preflop = json.load(source)
          assert preflop['publicationStatus'] == 'VALIDATION_ONLY'
          PY
          curl --fail --silent http://localhost:18080/api/v1/trainer/research/river/questions/42 > river-question.json
          python3 - <<'PY'
          import json
          import urllib.request
          with open('river-question.json', encoding='utf-8') as source:
              question = json.load(source)
          payload = json.dumps({
              'seed': question['seed'],
              'packHash': question['question']['packHash'],
              'action': question['question']['legalActions'][0],
          }).encode()
          request = urllib.request.Request(
              'http://localhost:18080/api/v1/trainer/research/river/grade',
              data=payload,
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request) as response:
              feedback = json.load(response)
          assert feedback['packHash'] == question['question']['packHash']
          assert feedback['evLossBb'] >= 0
          PY
          curl --fail --silent http://localhost:18080/api/v1/trainer/research/flop > flop.json
          python3 - <<'PY'
          import json
          import urllib.request
          with open('flop.json', encoding='utf-8') as source:
              metadata = json.load(source)
          assert metadata['publicationStatus'] == 'VALIDATION_ONLY'
          assert metadata['chanceModel'] == 'FULL_PHYSICAL_DECK'
          assert metadata['gameGapBb'] < 0.01
          payload = json.dumps({
              'seed': '42',
              'packHash': metadata['packHash'],
              'heroPlayer': 0,
              'actions': [],
          }).encode()
          request = urllib.request.Request(
              'http://localhost:18080/api/v1/trainer/research/flop/hands/replay',
              data=payload,
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request) as response:
              hand = json.load(response)
          assert hand['street'] == 'FLOP'
          assert hand['opponentCombo'] is None
          assert len(hand['legalActions']) == 2
          payload = json.dumps({
              'seed': '42',
              'packHash': metadata['packHash'],
              'heroPlayer': 0,
              'actions': ['k'],
          }).encode()
          request = urllib.request.Request(
              'http://localhost:18080/api/v1/trainer/research/flop/hands/replay',
              data=payload,
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request) as response:
              after_check = json.load(response)
          assert len(after_check['feedback']) == 1
          assert after_check['feedback'][0]['selectedEvBb'] is not None
          PY
      - name: Unequal-stack trainer overlay serves graded decisions
        run: |
          docker compose -f docker-compose.yml -f docker-compose.trainer.yml -f docker-compose.trainer-side-pot.yml up -d --no-deps api
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:18080/api/v1/trainer/research/multiway > multiway-side-pot.json; then
              if python3 -c "import json; assert json.load(open('multiway-side-pot.json'))['packSchema'] == 'multiway-side-pot-pack/v1'"; then break; fi
            fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          import urllib.request
          base = 'http://localhost:18080/api/v1/trainer/research/multiway'
          with urllib.request.urlopen(base) as response:
              metadata = json.load(response)
          assert metadata['stacksBb'] == [30, 10, 20, 15, 25, 5]
          assert metadata['payoffMethod'] == 'EXACT_ENUMERATION'
          assert metadata['nashConvBb'] < 0.05
          with urllib.request.urlopen(base + '/sessions/42/questions/0?player=5') as response:
              question = json.load(response)
          assert question['actingSeat'] == 'BB'
          assert question['stackBb'] == 5
          assert question['callCostBb'] == 4
          assert 'opponentCards' not in question
          assert 'callEvBb' not in question
          payload = json.dumps({
              'sessionSeed': '42', 'index': 0, 'player': 5,
              'packHash': question['packHash'], 'action': 'CALL',
          }).encode()
          request = urllib.request.Request(
              base + '/grade', data=payload,
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request) as response:
              graded = json.load(response)
          assert graded['question']['packHash'] == metadata['packHash']
          assert graded['feedback']['evLossBb'] >= 0
          PY
      - name: Service logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: compose-log, path: compose.log }
      - if: always()
        run: docker compose down -v
