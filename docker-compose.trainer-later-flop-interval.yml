      TRAINER_LATER_FLOP_INTERVAL_REPORT_PATH: /opt/pokerlab/later-flop-interval-report.json.gz
      TRAINER_LATER_FLOP_INTERVAL_REPORT_HASH: 4526ff928e05bc0e962d78661a19b82cb127d5e058f7a25bb8fd1e393c51f7ea
    volumes:
      - ./docs/data/supplied-four-button-hand-later-bb-flop-feedback-request.json:/opt/pokerlab/later-flop-interval-request.json:ro
